<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="text-scale" content="scale" />
		<meta name="description" content="Suas finanças pessoais, com calma e precisão." />
		<meta name="theme-color" content="#F2EEE4" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0F1612" media="(prefers-color-scheme: dark)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Vida Boa" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<title>Vida Boa</title>
		<script>
			// Aplica tema e paleta antes da primeira pintura, para não piscar.
			try {
				const t = localStorage.getItem('vb:theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
				const p = localStorage.getItem('vb:palette');
				if (p) document.documentElement.dataset.palette = p;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um push novo cancela o anterior que ainda não terminou.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # O site fica em https://<usuario>.github.io/<repositorio>/
      BASE_PATH: /${{ github.event.repository.name }}
      # Supabase: valores públicos por natureza (a chave publishable vai para o navegador
      # de qualquer forma; o RLS protege os dados). Defina em Settings › Secrets and
      # variables › Actions › Variables; sem eles o app funciona só no aparelho.
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm via Corepack (vem com o Node), na versão de "packageManager" do package.json.
      # Evita depender de uma action de terceiros num workflow que publica o site.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Verificação de tipos
        run: pnpm check

      - name: Testes unitários
        run: pnpm test:unit --run

      - name: Testes ponta a ponta
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Build
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
